[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-tools-default"
version = "0.1.0"
description = "Default Lumen tools plugin: builtin conversation tools, custom HTTP tools, and managed search/fetch/advisor"
requires-python = ">=3.11"
dependencies = ["lumen-plugin-api==0.1.0", "jsonschema==4.26.0", "beautifulsoup4>=4.12", "pypdf>=5.0"]

[project.entry-points."lumen.tools"]
default-tools = "lumen_tools_default:create_plugin"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<2"]
testing = ["pytest>=9.0.3", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["lumen_tools_default"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
lumen-plugin-api = { workspace = true }
