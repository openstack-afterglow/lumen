[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-database-mariadb"
version = "0.1.0"
description = "MariaDB async SQLAlchemy database plugin for Lumen"
requires-python = ">=3.11"
dependencies = ["lumen-plugin-api[database]==0.1.0", "sqlalchemy[asyncio]>=2.0.0", "aiomysql>=0.2.0"]

[project.entry-points."lumen.database"]
mariadb = "lumen_database_mariadb:create_plugin"

[project.optional-dependencies]
testing = ["pytest>=9.0.3", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["lumen_database_mariadb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
