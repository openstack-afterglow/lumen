---
- name: Precheck | Verify enable_lumen is set
  ansible.builtin.assert:
    that:
      - enable_lumen is defined
    fail_msg: "enable_lumen must be set in globals.yml"
  run_once: true
  tags: precheck

- name: Precheck | Verify stock Kolla Valkey dependency
  ansible.builtin.assert:
    that:
      - enable_valkey | default(false) | bool
      - groups.get('valkey', []) | length > 0
      - valkey_master_password is defined and valkey_master_password | length > 0
    fail_msg: "Deploy stock Kolla Valkey before enabling lumen; no plugin Redis fallback exists"
  run_once: true
  tags: precheck
  when: enable_lumen | default(false) | bool

- name: Precheck | Check required Lumen secrets
  ansible.builtin.assert:
    that:
      - lumen_database_password is defined and lumen_database_password | length > 0
      - lumen_keystone_password is defined and lumen_keystone_password | length > 0
      - lumen_encryption_key is defined and lumen_encryption_key is regex('^[0-9a-fA-F]{64}$')
    fail_msg: "Lumen DB/Keystone secrets must be set, and lumen_encryption_key must be exactly 64 hexadecimal characters"
  tags: precheck
  when: enable_lumen | bool

- name: Precheck | Verify Lumen chat execution protocol
  ansible.builtin.assert:
    that:
      - lumen_chat_execution_protocol_version in [1, 2]
    fail_msg: "lumen_chat_execution_protocol_version must be 1 or 2"
  tags: precheck
  when: enable_lumen | bool

- name: Precheck | Require protocol v2 checkpointer configuration
  ansible.builtin.assert:
    that:
      - lumen_enable_checkpointer | bool
      - lumen_checkpointer_postgres_url is defined and lumen_checkpointer_postgres_url | length > 0
      - lumen_checkpointer_postgres_url is match('^postgres(ql)?://\\S+$')
    fail_msg: "Protocol v2 requires lumen_enable_checkpointer and a PostgreSQL checkpointer URL; qualify encrypted API/worker checkpoint readiness before opening admission"
  tags: precheck
  no_log: true
  when:
    - enable_lumen | bool
    - lumen_chat_execution_protocol_version == 2

- name: Precheck | Validate Lumen public route hostname
  ansible.builtin.assert:
    that:
      - lumen_public_haproxy_fqdn is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
      - (lumen_public_endpoint_url | regex_replace('/$', '')) == ('https://' ~ lumen_public_haproxy_fqdn)
    fail_msg: "lumen_public_endpoint_url must be the HTTPS origin for lumen_public_haproxy_fqdn"
  run_once: true
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_public_haproxy_enabled | bool

- name: Precheck | Verify Lumen PostgreSQL mode
  ansible.builtin.assert:
    that:
      - lumen_postgres_mode in ['bundled', 'external']
    fail_msg: "lumen_postgres_mode must be either 'bundled' or 'external'"
  tags: precheck
  when: enable_lumen | bool

- name: Precheck | Verify bundled Lumen PostgreSQL configuration
  ansible.builtin.assert:
    that:
      - lumen_postgres_password is defined and lumen_postgres_password | length > 0
    fail_msg: "lumen_postgres_password must be set when lumen_postgres_mode is bundled"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_enable_checkpointer | bool
    - lumen_postgres_mode == 'bundled'

- name: Precheck | Verify external Lumen PostgreSQL URL
  ansible.builtin.assert:
    that:
      - lumen_external_postgres_url is defined and lumen_external_postgres_url | length > 0
      - lumen_external_postgres_url is match('^postgres(ql)?://\\S+$')
    fail_msg: "lumen_external_postgres_url must be a postgresql:// or postgres:// URL when lumen_postgres_mode is external"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_enable_checkpointer | bool
    - lumen_postgres_mode == 'external'

- name: Precheck | Verify Lumen pgvector memory URL if enabled
  ansible.builtin.assert:
    that:
      - lumen_memory_pgvector_url is defined and lumen_memory_pgvector_url | length > 0
      - lumen_memory_pgvector_url is match('^postgres(ql)?://\\S+$')
    fail_msg: "lumen_memory_pgvector_url must be a postgresql:// or postgres:// URL when lumen_enable_pgvector is true"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_enable_pgvector | bool

- name: Precheck | Validate typed runtime and deployment prerequisites
  become: true
  block:
    - name: Precheck | Allocate release validator script
      ansible.builtin.tempfile:
        state: file
        suffix: .lumen-precheck.py
      register: lumen_precheck_script

    - name: Precheck | Stage release validator script
      ansible.builtin.copy:
        src: validate_runtime_precheck.py
        dest: "{{ lumen_precheck_script.path }}"
        owner: root
        group: root
        mode: "0400"

    - name: Precheck | Run validator in canonical release image
      ansible.builtin.command:
        argv: "{{ ['docker', 'run', '--rm', '-i', '--pull=never', '--network', 'none', '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--user', '0', '--volume', lumen_precheck_script.path ~ ':/precheck.py:ro'] + (['--volume', lumen_controller_secrets_dir ~ ':/etc/lumen/controller:ro'] if lumen_runtime_enabled | bool else []) + (['--volume', lumen_worker_secrets_dir ~ ':/etc/lumen/worker-precheck:ro'] if lumen_runtime_enabled | bool and enable_lumen_worker | bool else []) + ['--entrypoint', 'python', lumen_api_image_ref, '/precheck.py', 'material'] }}"
        stdin: "{{ lumen_precheck_input | to_json }}"
      vars:
        lumen_precheck_input:
          runtime_enabled: "{{ lumen_runtime_enabled | bool }}"
          runtime_config: "{{ lumen_runtime_config }}"
          worker_enabled: "{{ enable_lumen_worker | bool }}"
          ca_expiry_margin_seconds: "{{ lumen_runtime_ca_expiry_margin_seconds }}"
          glance_image_evidence: "{{ lumen_runtime_glance_image_evidence }}"
          guest_artifact_evidence: "{{ lumen_runtime_guest_artifact_evidence }}"
          octavia_weight_zero_supported: "{{ lumen_runtime_octavia_weight_zero_supported }}"
          octavia_status_query_supported: "{{ lumen_runtime_octavia_status_query_supported }}"
          octavia_member_tags_supported: "{{ lumen_runtime_octavia_member_tags_supported }}"
          octavia_timeout_client_data: "{{ lumen_runtime_octavia_timeout_client_data }}"
          octavia_timeout_member_data: "{{ lumen_runtime_octavia_timeout_member_data }}"
          dynamic_ingress_vip: "{{ lumen_api_dynamic_ingress_vip }}"
          dynamic_ingress_port: "{{ lumen_api_dynamic_ingress_port }}"
          proxy_idle_timeout_seconds: "{{ lumen_api_proxy_idle_timeout_seconds }}"
          shared_external_frontend: "{{ lumen_public_haproxy_enabled | bool and haproxy_single_external_frontend | default(false) | bool }}"
          external_single_frontend_options: "{{ haproxy_external_single_frontend_options | default([]) }}"
          batch_enabled: "{{ lumen_batch_enabled | bool }}"
          media_enabled: "{{ lumen_media_enabled | default(false) | bool }}"
          storage:
            endpoint_url: "{{ lumen_s3_endpoint_url }}"
            bucket: "{{ lumen_s3_bucket }}"
            access_key: "{{ lumen_s3_access_key }}"
            secret_key: "{{ lumen_s3_secret_key }}"
            server_side_encryption: "{{ lumen_s3_server_side_encryption }}"
            kms_key_id: "{{ lumen_s3_kms_key_id }}"
          scanner:
            host: "{{ lumen_clamav_host }}"
            port: "{{ lumen_clamav_port }}"
      register: lumen_runtime_precheck_result
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Precheck | Require release validator execution
      ansible.builtin.assert:
        that:
          - lumen_runtime_precheck_result.rc == 0
        fail_msg: "runtime_precheck_execution: canonical Lumen image must run its typed validator"

    - name: Precheck | Require typed prerequisites with stable reasons
      ansible.builtin.assert:
        that:
          - (lumen_runtime_precheck_result.stdout | from_json).ok
        fail_msg: "{{ (lumen_runtime_precheck_result.stdout | from_json).reasons | join(', ') }}"
  always:
    - name: Precheck | Remove release validator script
      ansible.builtin.file:
        path: "{{ lumen_precheck_script.path }}"
        state: absent
      when: lumen_precheck_script.path is defined
  tags: precheck
  when:
    - enable_lumen | bool
    - inventory_hostname in groups['lumen']

- name: Precheck | Verify Lumen controller secret material
  become: true
  ansible.builtin.stat:
    path: "{{ lumen_controller_dispatch_key_file }}"
  register: lumen_dispatch_key_stat
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_runtime_enabled | bool
    - inventory_hostname in groups['lumen']

- name: Precheck | Require the controller dispatch key file
  ansible.builtin.assert:
    that:
      - lumen_dispatch_key_stat.stat.exists
      - lumen_dispatch_key_stat.stat.mode in ['0600', '0400']
      - lumen_dispatch_key_stat.stat.isreg
      - lumen_dispatch_key_stat.stat.uid == 0
    fail_msg: "runtime_dispatch_key_permissions: {{ lumen_controller_dispatch_key_file }} must exist with mode 0600/0400 on every lumen host"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_runtime_enabled | bool
    - inventory_hostname in groups['lumen']

- name: Precheck | Inspect worker-only TLS directory
  become: true
  ansible.builtin.stat:
    path: "{{ lumen_worker_secrets_dir }}"
  register: lumen_worker_secrets_stat
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_runtime_enabled | bool
    - enable_lumen_worker | bool
    - inventory_hostname in groups['lumen']

- name: Precheck | Require a restricted worker-only TLS directory
  ansible.builtin.assert:
    that:
      - lumen_worker_secrets_stat.stat.isdir
      - not lumen_worker_secrets_stat.stat.islnk
      - lumen_worker_secrets_stat.stat.uid == 0
      - lumen_worker_secrets_stat.stat.gid == 0
      - lumen_worker_secrets_stat.stat.mode == '0750'
    fail_msg: "runtime_worker_mount_permissions: {{ lumen_worker_secrets_dir }} must be root:root mode 0750"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_runtime_enabled | bool
    - enable_lumen_worker | bool
    - inventory_hostname in groups['lumen']

- name: Precheck | Inventory worker identity and manifest copies
  become: true
  ansible.builtin.find:
    paths: "{{ lumen_worker_secrets_dir }}"
    file_type: any
    hidden: true
    recurse: true
    follow: false
  register: lumen_worker_secrets_inventory
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_runtime_enabled | bool
    - enable_lumen_worker | bool
    - inventory_hostname in groups['lumen']

- name: Precheck | Require only worker identity and enabled sandbox manifest copies
  vars:
    lumen_worker_expected_files: "{{ (lumen_runtime_precheck_result.stdout | from_json).worker_inventory.files | map('replace', '/etc/lumen/worker-precheck/', lumen_worker_secrets_dir ~ '/') | list }}"
    lumen_worker_expected_directories: "{{ (lumen_runtime_precheck_result.stdout | from_json).worker_inventory.directories | map('replace', '/etc/lumen/worker-precheck/', lumen_worker_secrets_dir ~ '/') | list }}"
    lumen_worker_expected_manifests: "{{ (lumen_runtime_precheck_result.stdout | from_json).worker_inventory.manifests | map('replace', '/etc/lumen/worker-precheck/', lumen_worker_secrets_dir ~ '/') | list }}"
  ansible.builtin.assert:
    that:
      - (lumen_worker_secrets_inventory.files | map(attribute='path') | list | sort) == ((lumen_worker_expected_files + lumen_worker_expected_directories) | sort)
      - (lumen_worker_secrets_inventory.files | map(attribute='uid') | unique | list) == [0]
      - (lumen_worker_secrets_inventory.files | map(attribute='gid') | unique | list) == [0]
      - (lumen_worker_secrets_inventory.files | selectattr('islnk') | list | length) == 0
      - (lumen_worker_secrets_inventory.files | selectattr('isreg') | map(attribute='path') | list | sort) == (lumen_worker_expected_files | sort)
      - (lumen_worker_secrets_inventory.files | selectattr('isdir') | map(attribute='path') | list | sort) == (lumen_worker_expected_directories | sort)
      - (lumen_worker_secrets_inventory.files | selectattr('isdir') | rejectattr('mode', 'equalto', '0750') | list | length) == 0
      - (lumen_worker_secrets_inventory.files | selectattr('isreg') | rejectattr('mode', 'in', ['0440', '0640', '0444', '0644']) | list | length) == 0
      - (lumen_worker_secrets_inventory.files | selectattr('path', 'in', lumen_worker_expected_manifests) | rejectattr('mode', 'in', ['0444', '0644']) | list | length) == 0
      - (lumen_worker_secrets_inventory.files | selectattr('path', 'equalto', lumen_worker_secrets_dir ~ '/' ~ (lumen_runtime_config.tls.worker_client_key_file | basename)) | map(attribute='mode') | first) in ['0440', '0640']
    fail_msg: "runtime_worker_mount_material: require only root:root worker CA and fixed-worker cert/key, enabled Kubernetes manifest copies (0444/0644), and their exact ancestor directories (0750); no symlinks or controller private material"
  tags: precheck
  when:
    - enable_lumen | bool
    - lumen_runtime_enabled | bool
    - enable_lumen_worker | bool
    - inventory_hostname in groups['lumen']
