---
- name: Config | Ensure Lumen config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ lumen_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname in groups['lumen']

- name: Config | Render lumen.conf
  become: true
  ansible.builtin.template:
    src: lumen.conf.j2
    dest: "{{ lumen_config_dir }}/lumen.conf"
    mode: "0640"
    owner: root
    group: root
  when: inventory_hostname in groups['lumen']
  no_log: true

- name: Config | Ensure Lumen log directory is writable by appuser
  become: true
  community.docker.docker_container:
    name: lumen_log_dir_setup
    image: "{{ lumen_api_image_ref }}"
    pull: never
    user: "root"
    command:
      - sh
      - -c
      - |
        mkdir -p /var/log/kolla/lumen && \
        chown 1000:1000 /var/log/kolla/lumen && \
        chmod 0750 /var/log/kolla/lumen
    state: started
    detach: false
    cleanup: true
    volumes:
      - "kolla_logs:/var/log/kolla/"
  when: inventory_hostname in groups['lumen']
