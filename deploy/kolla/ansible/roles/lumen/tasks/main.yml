---
- name: Validate requested Lumen lifecycle action
  ansible.builtin.assert:
    that:
      - kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade', 'destroy', 'config']
    fail_msg: "Unsupported kolla_action '{{ kolla_action | default('deploy') }}' for lumen"

- name: Run requested Lumen lifecycle action
  ansible.builtin.include_tasks: "{{ kolla_action | default('deploy') }}.yml"
  when: kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade', 'destroy', 'config']
