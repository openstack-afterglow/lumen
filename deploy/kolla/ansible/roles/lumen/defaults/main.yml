---
# Lumen kolla role defaults

lumen_image_tag: "0.1.5"
lumen_image_namespace: "ghcr.io/openstack-afterglow"
lumen_api_image: "{{ lumen_image_namespace }}/lumen-api"
lumen_worker_image: "{{ lumen_image_namespace }}/lumen-worker"

lumen_source_mode: "{{ enable_lumen_source_build | default(enable_source_build | default(lumen_dev_mode | default(false))) | bool }}"
lumen_source_repo: "https://github.com/openstack-afterglow/lumen.git"
lumen_source_version: "a0ec3b2511eaf5fc2dc4cfc78247945939765044"
lumen_source_dir: "{{ lumen_source_checkout_path | default('/opt/afterglow/src/lumen') }}"
lumen_api_image_ref: "{{ 'afterglow-local/lumen-api:' ~ (lumen_source_version | truncate(12, True, '')) if (lumen_source_mode | bool) else (lumen_api_image ~ ':' ~ lumen_image_tag) }}"
lumen_worker_image_ref: "{{ 'afterglow-local/lumen-worker:' ~ (lumen_source_version | truncate(12, True, '')) if (lumen_source_mode | bool) else (lumen_worker_image ~ ':' ~ lumen_image_tag) }}"

enable_lumen: "no"
enable_lumen_api: "{{ enable_lumen }}"
enable_lumen_worker: "{{ enable_lumen }}"
lumen_run_preconditions: true

lumen_api_port: 8012
lumen_api_listen_address: "{{ 'api' | kolla_address(inventory_hostname) }}"
lumen_api_listen_port: 18012
lumen_database_name: "lumen"
lumen_database_user: "lumen"
lumen_database_address: "{{ database_address }}"
lumen_database_port: "{{ database_port }}"
lumen_database_admin_user: "{{ database_user }}"
lumen_database_admin_password: "{{ database_password }}"
lumen_database_url: "mysql+aiomysql://{{ lumen_database_user }}:{{ lumen_database_password }}@{{ lumen_database_address }}:{{ lumen_database_port }}/{{ lumen_database_name }}"
lumen_valkey_host: "{{ 'api' | kolla_address(groups['valkey'][0]) }}"
lumen_valkey_port: "{{ valkey_server_port }}"
lumen_valkey_password: "{{ valkey_master_password }}"
lumen_redis_db_index: 8
lumen_redis_url: "redis://default:{{ lumen_valkey_password }}@{{ lumen_valkey_host }}:{{ lumen_valkey_port }}/{{ lumen_redis_db_index }}"

lumen_keystone_user: "lumen"
lumen_keystone_auth_url: "{{ keystone_internal_url }}"
lumen_keystone_project_domain_name: "{{ default_project_domain_name }}"
lumen_keystone_user_domain_name: "{{ default_user_domain_name }}"
lumen_keystone_region_name: "{{ openstack_region_name }}"
lumen_keystone_interface: "{{ openstack_interface | default('internal') }}"
lumen_service_project_name: "lumen-service"
lumen_external_url: "{{ public_protocol | default('https') }}://{{ kolla_external_fqdn | default('localhost') }}:{{ lumen_api_port }}"
lumen_public_endpoint_url: "{{ lumen_external_url }}"
lumen_public_api_base: "{{ lumen_public_endpoint_url }}"
lumen_internal_endpoint_url: "{{ internal_protocol | default('http') }}://{{ kolla_internal_fqdn | default(kolla_internal_vip_address) }}:{{ lumen_api_port }}"
lumen_admin_endpoint_url: "{{ lumen_internal_endpoint_url }}"

# Optional Kolla external-VIP route. Keep lumen-api internal so the internal
# and admin Keystone endpoints continue to use the internal VIP listener.
lumen_public_haproxy_enabled: false
lumen_public_haproxy_fqdn: ""

lumen_encryption_key: ""
lumen_mcp_service_token: "{{ afterglow_lumen_mcp_service_token | default('') }}"
lumen_mcp_control_plane_url: "{{ internal_protocol | default('http') }}://{{ kolla_internal_fqdn | default(kolla_internal_vip_address) }}"

# PostgreSQL selection for the LangGraph checkpointer. `bundled` creates the
# plugin-owned lumen_postgres container; `external` creates no PostgreSQL
# resource and requires the explicit external connection settings below.
lumen_postgres_mode: "external"

# Bundled PostgreSQL container.
lumen_postgres_image_ref: "pgvector/pgvector:0.8.6-pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b"
lumen_postgres_database: "lumen"
lumen_postgres_user: "lumen"
lumen_postgres_password: ""
lumen_postgres_bind_address: "172.30.0.11"
lumen_postgres_port: 5432
lumen_postgres_volume: "lumen_postgres_data"

# Kolla 2025.2 has no PostgreSQL role. `bundled` is a plugin-owned container
# managed by this Kolla role; `external` uses one operator-provided URL.
lumen_external_postgres_url: ""

# Lumen LangGraph Checkpointer.
lumen_enable_checkpointer: true
lumen_checkpointer_postgres_url: "{{ 'postgresql://' ~ lumen_postgres_user ~ ':' ~ lumen_postgres_password ~ '@' ~ lumen_postgres_bind_address ~ ':' ~ lumen_postgres_port ~ '/' ~ lumen_postgres_database if (lumen_postgres_mode == 'bundled') else lumen_external_postgres_url }}"

# Lumen pgvector Semantic Memory Store
lumen_enable_pgvector: false
lumen_memory_pgvector_url: ""
chat_semantic_memory_enabled: false

# Lumen S3 Asset Storage
lumen_s3_endpoint_url: ""
lumen_s3_bucket: "lumen-assets"
lumen_s3_access_key: ""
lumen_s3_secret_key: ""
lumen_s3_region: "us-east-1"

# Lumen Sandbox & External Chat API Hosts
lumen_sandbox_api_key: ""
lumen_chat_api_hosts: ""
lumen_chat_default_model: ""
lumen_chat_compat_run_timeout_seconds: 300

lumen_service_environments:
  lumen-api:
    LUMEN_CONFIG_FILE: "/etc/lumen/lumen.conf"
    DATABASE_URL: "{{ lumen_database_url }}"
    REDIS_URL: "{{ lumen_redis_url }}"
    KEYSTONE_AUTH_URL: "{{ lumen_keystone_auth_url }}"
    KEYSTONE_ADMIN_USERNAME: "{{ lumen_keystone_user }}"
    KEYSTONE_ADMIN_PASSWORD: "{{ lumen_keystone_password }}"
    KEYSTONE_ADMIN_PROJECT: "{{ lumen_service_project_name }}"
    KEYSTONE_DOMAIN: "{{ lumen_keystone_user_domain_name }}"
    KEYSTONE_REGION_NAME: "{{ lumen_keystone_region_name }}"
    KEYSTONE_INTERFACE: "{{ lumen_keystone_interface }}"
    LUMEN_ENCRYPTION_KEY: "{{ lumen_encryption_key }}"
    MCP_CONTROL_PLANE_URL: "{{ lumen_mcp_control_plane_url }}"
    LUMEN_MCP_SERVICE_TOKEN: "{{ lumen_mcp_service_token }}"
    CHAT_CHECKPOINTER_POSTGRES_URL: "{{ lumen_checkpointer_postgres_url }}"
    CHAT_MEMORY_PGVECTOR_URL: "{{ lumen_memory_pgvector_url }}"
    CHAT_ASSET_S3_ACCESS_KEY: "{{ lumen_s3_access_key }}"
    CHAT_ASSET_S3_SECRET_KEY: "{{ lumen_s3_secret_key }}"
    CHAT_SANDBOX_API_KEY: "{{ lumen_sandbox_api_key }}"
  lumen-worker:
    LUMEN_CONFIG_FILE: "/etc/lumen/lumen.conf"
    DATABASE_URL: "{{ lumen_database_url }}"
    REDIS_URL: "{{ lumen_redis_url }}"
    KEYSTONE_AUTH_URL: "{{ lumen_keystone_auth_url }}"
    KEYSTONE_ADMIN_USERNAME: "{{ lumen_keystone_user }}"
    KEYSTONE_ADMIN_PASSWORD: "{{ lumen_keystone_password }}"
    KEYSTONE_ADMIN_PROJECT: "{{ lumen_service_project_name }}"
    KEYSTONE_DOMAIN: "{{ lumen_keystone_user_domain_name }}"
    KEYSTONE_REGION_NAME: "{{ lumen_keystone_region_name }}"
    KEYSTONE_INTERFACE: "{{ lumen_keystone_interface }}"
    LUMEN_ENCRYPTION_KEY: "{{ lumen_encryption_key }}"
    MCP_CONTROL_PLANE_URL: "{{ lumen_mcp_control_plane_url }}"
    LUMEN_MCP_SERVICE_TOKEN: "{{ lumen_mcp_service_token }}"
    CHAT_CHECKPOINTER_POSTGRES_URL: "{{ lumen_checkpointer_postgres_url }}"
    CHAT_MEMORY_PGVECTOR_URL: "{{ lumen_memory_pgvector_url }}"
    CHAT_ASSET_S3_ACCESS_KEY: "{{ lumen_s3_access_key }}"
    CHAT_ASSET_S3_SECRET_KEY: "{{ lumen_s3_secret_key }}"
    CHAT_SANDBOX_API_KEY: "{{ lumen_sandbox_api_key }}"

lumen_services:
  lumen-api:
    container_name: lumen_api
    group: lumen
    enabled: "{{ enable_lumen_api | bool }}"
    image: "{{ lumen_api_image_ref }}"
    network_mode: host
    command: ["uvicorn", "lumen.main:app", "--host", "{{ lumen_api_listen_address }}", "--port", "{{ lumen_api_listen_port | string }}"]
    restart_policy: unless-stopped
    volumes:
      - "/etc/kolla/lumen/lumen.conf:/etc/lumen/lumen.conf:ro"
      - "kolla_logs:/var/log/kolla/"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://{{ lumen_api_listen_address }}:{{ lumen_api_listen_port }}/v1/health', timeout=5); assert response.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    haproxy:
      lumen-api:
        enabled: "{{ enable_lumen_api | bool }}"
        external: false
        port: "{{ lumen_api_port }}"
        listen_port: "{{ lumen_api_listen_port }}"
        host_group: lumen
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /v1/health"
          - "http-check expect status 200"

  lumen-worker:
    container_name: lumen_worker
    group: lumen
    enabled: "{{ enable_lumen_worker | bool }}"
    image: "{{ lumen_worker_image_ref }}"
    command: ["python", "-m", "lumen.worker"]
    network_mode: host
    restart_policy: unless-stopped
    volumes:
      - "/etc/kolla/lumen/lumen.conf:/etc/lumen/lumen.conf:ro"
      - "kolla_logs:/var/log/kolla/"
lumen_public_haproxy_services:
  lumen-public:
    group: lumen
    enabled: "{{ enable_lumen_api | bool and lumen_public_haproxy_enabled | bool }}"
    haproxy:
      lumen-public:
        enabled: "{{ enable_lumen_api | bool and lumen_public_haproxy_enabled | bool }}"
        external: true
        external_fqdn: "{{ lumen_public_haproxy_fqdn }}"
        mode: http
        with_frontend: true
        with_backend: true
        host_group: lumen
        port: "{{ lumen_api_port }}"
        listen_port: "{{ lumen_api_listen_port }}"
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /v1/health"
          - "http-check expect status 200"

lumen_haproxy_services: "{{ lumen_services | combine(lumen_public_haproxy_services, recursive=True) }}"
