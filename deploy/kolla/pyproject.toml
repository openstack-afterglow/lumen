[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-kolla"
dynamic = ["version"]
description = "Lumen Kolla-Ansible roles and packaging"
requires-python = ">=3.11"
dependencies = [
    "kolla-ansible>=21,<22",
]

[tool.hatch.version]
path = "../../lumen/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen_kolla"]

[tool.hatch.build.targets.wheel.shared-data]
"ansible/roles/lumen" = "share/kolla-ansible/ansible/roles/lumen"
