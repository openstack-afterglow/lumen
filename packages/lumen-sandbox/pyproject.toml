[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-sandbox"
version = "0.1.0"
description = "Isolated, fenced Lumen sandbox execution daemon"
requires-python = ">=3.12"
dependencies = ["starlette>=0.46,<1", "uvicorn>=0.34,<1", "cryptography>=44,<48"]

[project.scripts]
lumen-sandbox = "lumen_sandbox.server:main"

[project.optional-dependencies]
testing = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["lumen_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
